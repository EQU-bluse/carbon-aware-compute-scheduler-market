[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carbon-aware-compute-scheduling-market"
version = "0.1.0"
description = "Backend for a carbon-aware batch-compute scheduling market"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["carbon_market*"]
